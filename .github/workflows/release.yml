name: Release

on:
  push:
    branches: [main]
  # Merges performed with the workflow token (Dependabot auto-merge) do not
  # trigger push workflows, so a daily pass releases any HEAD not yet tagged.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is HEAD already released?
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.probe.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: probe
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "HEAD is already tagged: $(git tag --points-at HEAD 'v*' | tr '\n' ' ')"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build signed APK and publish release
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          patch="$(git rev-list --count HEAD)"
          {
            echo "name=${base}.${patch}"
            echo "patch=${patch}"
            echo "tag=v${base}.${patch}"
          } >> "$GITHUB_OUTPUT"

      - name: Gate on tests and coverage
        run: ./gradlew --no-daemon testDebugUnitTest koverVerifyDebug

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          TAPSHIM_PATCH: ${{ steps.version.outputs.patch }}
          TAPSHIM_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TAPSHIM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TAPSHIM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TAPSHIM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "tapshim-${{ steps.version.outputs.name }}.apk"

      - name: Verify signature
        run: |
          tool="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          "$tool" verify --print-certs "tapshim-${{ steps.version.outputs.name }}.apk"

      - name: Release notes
        id: notes
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          {
            echo "## TapShim ${{ steps.version.outputs.name }}"
            echo
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo
              git log --no-merges --pretty='- %s (%h)' "$prev"..HEAD
            else
              echo "First release."
            fi
          } > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "tapshim-${{ steps.version.outputs.name }}.apk" \
            --title "TapShim ${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
